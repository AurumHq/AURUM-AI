<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURUM AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#0b0b0b;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;
}
header{
background:#111;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:2px solid #caa64b;
}
.logo{
font-size:32px;
font-weight:700;
color:#d4af37;
}
.live{
color:#00ff66;
font-weight:bold;
}
.container{
max-width:1200px;
margin:auto;
padding:30px;
}
.card{
background:#171717;
border:1px solid #333;
border-radius:16px;
padding:25px;
margin-bottom:20px;
}
.signal{
font-size:64px;
font-weight:bold;
color:#ff4d4d;
}
.confidence{
font-size:22px;
margin-top:10px;
color:#d4af37;
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}
.metric{
font-size:20px;
padding:12px 0;
border-bottom:1px solid #333;
}
button{
width:100%;
padding:18px;
font-size:20px;
font-weight:bold;
background:#d4af37;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:20px;
}
button:hover{
background:#e6c454;
}
@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}
.signal{
font-size:46px;
}
}
</style>
</head>

<body>

<header>
<div class="logo">AURUM AI</div>
<div class="live">● LIVE</div>
</header>

<div class="container">

<div class="card">
<div class="signal">SELL</div>
<div class="confidence">Confidence: 43%</div>
</div>

<div class="grid">

<div class="card">
<h2>Trade Setup</h2>

<div class="metric"><b>Action:</b> SELL</div>
<div class="metric"><b>Entry:</b> 2351.96 - 2352.56</div>
<div class="metric"><b>Stop:</b> 2356.01</div>
<div class="metric"><b>Target 1:</b> 2347.76</div>
<div class="metric"><b>Target 2:</b> 2344.76</div>

<button>Execute Paper Trade</button>

</div>

<div class="card">

<h2>AI Models</h2>

<div class="metric">SMC Engine</div>

<div class="metric">Liquidity Model</div>

<div class="metric">Trend Engine</div>

<div class="metric">Volume Analysis</div>

<div class="metric">Risk Engine</div>

<div class="metric">Ensemble Consensus</div>

</div>

</div>

</div>

</body>
</html>
